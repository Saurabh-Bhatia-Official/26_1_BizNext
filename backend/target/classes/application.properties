spring.application.name=biznext-api
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${NEON_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${NEON_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
