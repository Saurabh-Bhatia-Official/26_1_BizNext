env:
  FLUTTER_ROOT: "default"

releases:
  - name: dev
    jobs:
      - name: release-windows-exe
        package:
          platform: windows
          target: exe
      - name: release-linux-deb
        package:
          platform: linux
          target: deb
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
      - name: release-macos-dmg
        package:
          platform: macos
          target: dmg
      - name: release-android-apk
        package:
          platform: android
          target: apk
      - name: release-ios-ipa
        package:
          platform: ios
          target: ipa
