name: Multi-Platform Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for automatic versioning, e.g. v0.0.1)'
        required: false
        default: ''
      repository:
        description: 'Target Release Repository (e.g. owner/repo). Defaults to current repository.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create Prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 0. Determine Version ───────────────────────────────────────────────────
  determine-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc-version.outputs.version }}
      clean_version: ${{ steps.calc-version.outputs.clean_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: calc-version
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, re

          manual_tag = os.environ.get("MANUAL_TAG", "").strip()
          if manual_tag:
              tag = manual_tag if manual_tag.startswith("v") else f"v{manual_tag}"
          else:
              subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
              res = subprocess.run(["git", "tag", "-l"], capture_output=True, text=True)
              tags = res.stdout.strip().splitlines()

              patch_numbers = []
              for t in tags:
                  m = re.match(r"^v?0\.0\.(\d+)$", t.strip())
                  if m:
                      patch_numbers.append(int(m.group(1)))

              if patch_numbers:
                  latest_patch = max(patch_numbers)
                  next_patch = latest_patch + 1
                  tag = f"v0.0.{next_patch}"
              else:
                  tag = "v0.0.1"

          clean_ver = tag.lstrip("v")
          print(f"Calculated Release Tag: {tag}")
          print(f"Clean Version: {clean_ver}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"version={tag}\n")
                  f.write(f"clean_version={clean_ver}\n")
          EOF

  # ── 1. Windows Build ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (EXE & Portable ZIP)
    runs-on: windows-latest
    needs: [determine-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Database Integrity Tests
        run: flutter test test/database_init_safety_test.dart

      - name: Build Windows Release Binary
        run: flutter build windows --release

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "BizNext-Windows-x64.zip" -Force

      - name: Build Windows Inno Setup Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $cleanVersion = "${{ needs.determine-version.outputs.clean_version }}"
          if (-not $cleanVersion) { $cleanVersion = "0.0.1" }
          iscc /DMyAppVersion="$cleanVersion" /O"build\windows\installer" /F"BizNext-Windows-x64" installer.iss
          Copy-Item -Path "build\windows\installer\BizNext-Windows-x64.exe" -Destination "BizNext-Windows-x64.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            BizNext-Windows-x64.exe
            BizNext-Windows-x64.zip
          retention-days: 14

  # ── 2. Linux Build ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (DEB & Portable ZIP)
    runs-on: ubuntu-latest
    needs: [determine-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Database Integrity Tests
        run: flutter test test/database_init_safety_test.dart

      - name: Build Linux Release Binary
        run: flutter build linux --release

      - name: Package Linux Portable ZIP
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../BizNext-Linux-x64.zip .
          cd -

      - name: Package Linux Debian (.deb) Package
        run: |
          chmod +x scripts/package_linux_deb.sh
          TAG="${{ needs.determine-version.outputs.version }}"
          if [ -z "$TAG" ]; then TAG="v0.0.1"; fi
          ./scripts/package_linux_deb.sh "$TAG" "BizNext-Linux-x64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            BizNext-Linux-x64.deb
            BizNext-Linux-x64.zip
          retention-days: 14

  # ── 3. macOS Build ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (DMG & Portable ZIP)
    runs-on: macos-latest
    needs: [determine-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release Binary
        run: flutter build macos --release

      - name: Package macOS Portable ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../BizNext-macOS.zip biz_next.app
          cd -

      - name: Package macOS DMG Disk Image
        run: |
          brew install create-dmg || true
          chmod +x scripts/package_macos_dmg.sh
          ./scripts/package_macos_dmg.sh "build/macos/Build/Products/Release/biz_next.app" "BizNext-macOS.dmg" "BizNext"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            BizNext-macOS.dmg
            BizNext-macOS.zip
          retention-days: 14

  # ── 4. Android Build ────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: [determine-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Stage Android APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk BizNext-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: BizNext-Android.apk
          retention-days: 14

  # ── 5. iOS Build ────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    needs: [determine-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release Payload
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qq -r BizNext-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: BizNext-iOS.ipa
          retention-days: 14

  # ── 6. Publish GitHub Release ───────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-windows, build-linux, build-macos, build-android, build-ios]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Compute Checksums and Validate Files
        id: prep
        run: |
          cd release_assets
          ls -la
          sha256sum BizNext-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -
          
          TAG="${{ needs.determine-version.outputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="v0.0.1"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          TARGET_REPO="${{ github.event.inputs.repository }}"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="${{ github.repository }}"
          fi
          echo "TARGET_REPO=$TARGET_REPO" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: BizNext ${{ env.RELEASE_TAG }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: false
          body: ""
          files: |
            release_assets/BizNext-Windows-x64.exe
            release_assets/BizNext-Windows-x64.zip
            release_assets/BizNext-Linux-x64.deb
            release_assets/BizNext-Linux-x64.zip
            release_assets/BizNext-macOS.dmg
            release_assets/BizNext-macOS.zip
            release_assets/BizNext-Android.apk
            release_assets/BizNext-iOS.ipa
            release_assets/SHA256SUMS.txt
