name: Frontend Build, Release & Vercel Deploy

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'frontend-v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-release.yaml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0 or frontend-v1.0.0)'
        required: false
        default: 'v1.0.0'
      repository:
        description: 'Target Release Repository (e.g. owner/repo). Defaults to current repository.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create Prerelease'
        required: false
        type: boolean
        default: false
      deploy_vercel:
        description: 'Deploy Web to Vercel'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ── 1. Web Build ────────────────────────────────────────────────────────────
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Database Integrity Tests
        working-directory: frontend
        run: flutter test test/database_init_safety_test.dart

      - name: Build Flutter Web Production Binary
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build web --release \
            --dart-define=BACKEND_BASE_URL="$BACKEND_URL" \
            --dart-define=BIZNEXT_API_BASE_URL="$BACKEND_URL/api/customers"

      - name: Package Web ZIP Archive
        run: |
          cd frontend/build/web
          zip -r ../../../BizNext-Web.zip .
          cd -

      - name: Upload Web Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: BizNext-Web.zip
          retention-days: 14

      - name: Upload Web Build Output (for Vercel Deploy)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build/web
          retention-days: 14

  # ── 2. Vercel Deployment ────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_vercel == true || github.event.inputs.deploy_vercel == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Prebuilt Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy_web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and Configure Vercel Project
        id: vercel-prep
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_LuPg78TF1MNK1AEohxSgXZNpXMgS' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. Please add VERCEL_TOKEN in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is not configured. Retrieve your Organization/Team ID from Vercel Dashboard -> Settings -> General (or Team Settings) and add it to GitHub Actions Secrets or Variables."
            exit 1
          fi

          # Link project configuration in deploy folder
          mkdir -p deploy_web/.vercel
          cat << EOF > deploy_web/.vercel/project.json
          {
            "projectId": "$VERCEL_PROJECT_ID",
            "orgId": "$VERCEL_ORG_ID"
          }
          EOF

          echo "Vercel configuration successfully initialized for Project ID: $VERCEL_PROJECT_ID"

      - name: Deploy to Vercel Production
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_LuPg78TF1MNK1AEohxSgXZNpXMgS' }}
        run: |
          cd deploy_web
          echo "Starting Vercel production deployment..."
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "::notice::Frontend deployed successfully to Vercel: $DEPLOY_URL"
          cd -

  # ── 3. Windows Build ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (EXE & Portable ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Database Integrity Tests
        working-directory: frontend
        run: flutter test test/database_init_safety_test.dart

      - name: Build Windows Release Binary
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build windows --release `
            --dart-define=BACKEND_BASE_URL="$env:BACKEND_URL" `
            --dart-define=BIZNEXT_API_BASE_URL="$env:BACKEND_URL/api/customers"

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "frontend\build\windows\x64\runner\Release\*" -DestinationPath "BizNext-Windows-x64.zip" -Force

      - name: Build Windows Inno Setup Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $tag) { $tag = "1.0.0" }
          $cleanVersion = $tag.TrimStart('v')
          cd frontend
          iscc /DMyAppVersion="$cleanVersion" /O"build\windows\installer" /F"BizNext-Windows-x64" installer.iss
          Copy-Item -Path "build\windows\installer\BizNext-Windows-x64.exe" -Destination "..\BizNext-Windows-x64.exe"
          cd ..

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            BizNext-Windows-x64.exe
            BizNext-Windows-x64.zip
          retention-days: 14

  # ── 4. Linux Build ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (DEB & Portable ZIP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Verify Database Integrity Tests
        working-directory: frontend
        run: flutter test test/database_init_safety_test.dart

      - name: Build Linux Release Binary
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build linux --release \
            --dart-define=BACKEND_BASE_URL="$BACKEND_URL" \
            --dart-define=BIZNEXT_API_BASE_URL="$BACKEND_URL/api/customers"

      - name: Package Linux Portable ZIP
        run: |
          cd frontend/build/linux/x64/release/bundle
          zip -r ../../../../../BizNext-Linux-x64.zip .
          cd -

      - name: Package Linux Debian (.deb) Package
        run: |
          chmod +x frontend/scripts/package_linux_deb.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag_name || '1.0.0' }}"
          fi
          if [ -z "$TAG" ]; then TAG="1.0.0"; fi
          cd frontend
          ./scripts/package_linux_deb.sh "$TAG" "../BizNext-Linux-x64.deb"
          cd ..

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            BizNext-Linux-x64.deb
            BizNext-Linux-x64.zip
          retention-days: 14

  # ── 5. macOS Build ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (DMG & Portable ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build macOS Release Binary
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build macos --release \
            --dart-define=BACKEND_BASE_URL="$BACKEND_URL" \
            --dart-define=BIZNEXT_API_BASE_URL="$BACKEND_URL/api/customers"

      - name: Package macOS Portable ZIP
        run: |
          cd frontend/build/macos/Build/Products/Release
          zip -r -y ../../../../../BizNext-macOS.zip biz_next.app
          cd -

      - name: Package macOS DMG Disk Image
        run: |
          brew install create-dmg || true
          chmod +x frontend/scripts/package_macos_dmg.sh
          cd frontend
          ./scripts/package_macos_dmg.sh "build/macos/Build/Products/Release/biz_next.app" "../BizNext-macOS.dmg" "BizNext"
          cd ..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            BizNext-macOS.dmg
            BizNext-macOS.zip
          retention-days: 14

  # ── 6. Android Build ────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build apk --release \
            --dart-define=BACKEND_BASE_URL="$BACKEND_URL" \
            --dart-define=BIZNEXT_API_BASE_URL="$BACKEND_URL/api/customers"

      - name: Stage Android APK Artifact
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk BizNext-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: BizNext-Android.apk
          retention-days: 14

  # ── 7. iOS Build ────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS Release Payload
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://two6-1-biznext.onrender.com' }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=BACKEND_BASE_URL="$BACKEND_URL" \
            --dart-define=BIZNEXT_API_BASE_URL="$BACKEND_URL/api/customers"

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -R frontend/build/ios/iphoneos/Runner.app Payload/
          zip -qq -r BizNext-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: BizNext-iOS.ipa
          retention-days: 14

  # ── 8. Publish GitHub Release ───────────────────────────────────────────────
  publish-release:
    name: Publish Frontend GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-android, build-ios, build-web]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Compute Checksums and Validate Files
        id: prep
        run: |
          cd release_assets
          ls -la
          sha256sum BizNext-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -
          
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          TARGET_REPO="${{ github.event.inputs.repository }}"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="${{ github.repository }}"
          fi
          echo "TARGET_REPO=$TARGET_REPO" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: BizNext ${{ env.RELEASE_TAG }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release_assets/BizNext-Windows-x64.exe
            release_assets/BizNext-Windows-x64.zip
            release_assets/BizNext-Linux-x64.deb
            release_assets/BizNext-Linux-x64.zip
            release_assets/BizNext-macOS.dmg
            release_assets/BizNext-macOS.zip
            release_assets/BizNext-Android.apk
            release_assets/BizNext-iOS.ipa
            release_assets/BizNext-Web.zip
            release_assets/SHA256SUMS.txt
          body: |
            ## BizNext Release ${{ env.RELEASE_TAG }}
            
            Welcome to the official release of **BizNext** — Production-ready POS & ERP Business Management System.
            
            ### Available Packages & Downloads
            
            | Platform | File | Description |
            | :--- | :--- | :--- |
            | **Web App** | [`BizNext-Web.zip`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Web.zip) | Standalone web bundle (deployed live on Vercel) |
            | **Windows** | [`BizNext-Windows-x64.exe`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Windows-x64.exe) | Complete installer with wizard & desktop shortcuts |
            | **Windows** | [`BizNext-Windows-x64.zip`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Windows-x64.zip) | Portable standalone zip distribution |
            | **Linux** | [`BizNext-Linux-x64.deb`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Linux-x64.deb) | Debian/Ubuntu package (`sudo dpkg -i` or `sudo apt install`) |
            | **Linux** | [`BizNext-Linux-x64.zip`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Linux-x64.zip) | Portable standalone Linux bundle |
            | **macOS** | [`BizNext-macOS.dmg`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-macOS.dmg) | Disk image with drag-and-drop to Applications folder |
            | **macOS** | [`BizNext-macOS.zip`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-macOS.zip) | Portable macOS `.app` bundle |
            | **Android** | [`BizNext-Android.apk`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-Android.apk) | Production release APK for Android devices |
            | **iOS** | [`BizNext-iOS.ipa`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/BizNext-iOS.ipa) | Production release IPA for iOS devices |
            | **Checksums** | [`SHA256SUMS.txt`](https://github.com/${{ env.TARGET_REPO }}/releases/download/${{ env.RELEASE_TAG }}/SHA256SUMS.txt) | SHA256 integrity verification hashes |
            
            ### Installation Instructions
            
            - **Windows**: Run `BizNext-Windows-x64.exe` and follow the setup wizard.
            - **Debian / Ubuntu**:
              ```bash
              sudo dpkg -i BizNext-Linux-x64.deb
              # Or with apt:
              sudo apt install ./BizNext-Linux-x64.deb
              ```
            - **macOS**: Open `BizNext-macOS.dmg` and drag `BizNext.app` into your `Applications` directory.
            - **Android**: Install `BizNext-Android.apk` on your device (enable install from unknown sources if prompted).
            - **iOS**: Sideload or deploy `BizNext-iOS.ipa` via AltStore, Sideloadly, or enterprise MDM.
            
            ### Data Safety Guarantee
            BizNext automatically manages its internal database. On first launch, required tables and default configurations are safely established. Existing application data is preserved across all updates and upgrades without destructive modifications.
