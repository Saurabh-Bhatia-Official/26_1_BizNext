name: biz_next
description: "A production-ready POS & ERP Business Management System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  file_picker: ^8.0.3
  pdf: ^3.10.8
  printing: ^5.11.1
  share_plus: ^10.1.0
  encrypt: ^5.0.3
  mobile_scanner: ^7.2.0
  simple_barcode_scanner: ^0.6.0
  camera: ^0.12.0+1
  camera_windows: ^0.2.1
  http: ^1.2.1
  package_info_plus: ^9.0.1
  dio: ^5.11.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256 # Optional: up to 256
  image_path: "assets/logo.png"
  min_sdk_android: 21
